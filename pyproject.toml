[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-system"
version = "0.1.0"
description = "RAG system: Docling/Unstructured/Tika + LlamaIndex + Qdrant + PostgreSQL, retrieval funnel (filter -> hybrid -> rerank)"
requires-python = ">=3.10"
dependencies = [
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "psycopg[binary]>=3.1",
  "qdrant-client>=1.10",
  "fastembed>=0.3",
  "sentence-transformers>=3.0",
  "llama-index-core>=0.11",
  "llama-index-llms-openai>=0.2",
  "llama-index-llms-openai-like>=0.3",
  "docling>=2.0",
  "unstructured[all-docs]>=0.15",
  "tika>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
